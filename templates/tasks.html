{% extends "base.html" %}
{% set active_page = "tasks" %}

{% block title %}Tasks · PlanIT{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">
{% endblock %}

{% block content %}
<div class="main-wrapper">
    <div class="tasks-shell">
        <div class="filter-sidebar">
            <h3 class="filter-title">Select List</h3>
            <select class="list-dropdown" onchange="location = '/tasks?list_name=' + this.value;">
                {% if not list_names %}
                    <option disabled selected>No lists found</option>
                {% endif %}
                {% for name in list_names %}
                    <option value="{{ name }}" {% if name == selected_list %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="task-container">
            <h1 class="page-title">Tasks</h1>

            <div class="list-header-box">
                <span class="list-title-label">Current List:</span>
                <input type="text" 
                    id="list-name-input" 
                    class="list-name-display" 
                    value="{{ selected_list }}" 
                    >
            </div>

            <div class="tasks-section">
                <div class="tasks-tab">Items</div>
                <div class="tasks-body">
                    {% for task in tasks %}
                        <div class="task-row" id="task-container-{{ task.id }}">
                            <input type="checkbox" 
                                class="task-checkbox" 
                                data-task-id="{{ task.id }}"
                                {% if task.is_completed %}checked{% endif %}>
                            
                            <input type="text" 
                                class="task-text-input" 
                                data-task-id="{{ task.id }}"
                                value="{{ task.task_name }}"
                                >

                            <button class="delete-task-btn" data-task-id="{{ task.id }}">Delete</button>
                        </div>
                    {% endfor %}

                    <div id="new-task-container" style="display: none;" class="task-row">
                        <input type="text" id="new-task-input" placeholder="Enter task name..." 
                            style="width: 100%; border: none; background: transparent; font-weight: bold; outline: none; color: inherit;">
                    </div>

                    <button class="add-btn" id="show-add-input">+ Add Item</button>
                </div>
            </div>

            <div class="btn-container" style="flex-direction: column; align-items: center; gap: 15px;">
                <button class="add-list-btn" id="add-new-list-btn">Add New List</button>
                <button class="delete-list-btn" id="delete-list-btn">Delete Current List</button>
            </div>
        </div> 
    </div>
</div> 

<script>
// --- TOGGLE & SUBMIT NEW TASK ---
const addBtn = document.getElementById('show-add-input');
const inputContainer = document.getElementById('new-task-container');
const taskInput = document.getElementById('new-task-input');

addBtn.addEventListener('click', () => {
    inputContainer.style.display = 'flex';
    taskInput.focus();
    addBtn.style.display = 'none'; // Hide button while typing
});

taskInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && this.value.trim() !== '') {
        const taskName = this.value.trim();
        const currentList = "{{ selected_list }}"; // Pass the Jinja2 variable to JS

        fetch('/tasks/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                task_name: taskName, 
                list_name: currentList 
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload(); // Refresh to show the new task in the list
            } else {
                alert('Error adding task.');
            }
        });
    }
});

// --- TOGGLE CHECKBOX (Existing Logic) ---
document.querySelectorAll('.task-checkbox').forEach(checkbox => {
    checkbox.addEventListener('change', function() {
        const taskId = this.getAttribute('data-task-id');
        const isCompleted = this.checked;
        const taskText = this.nextElementSibling;

        if (isCompleted) {
            taskText.style.textDecoration = 'line-through';
            taskText.style.opacity = '0.6';
        } else {
            taskText.style.textDecoration = 'none';
            taskText.style.opacity = '1';
        }

        fetch(`/tasks/toggle/${taskId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_completed: isCompleted })
        })
        .catch(error => {
            console.error('Error:', error);
            this.checked = !isCompleted;
        });
    });
});

// --- CREATE NEW LIST ---
const newListBtn = document.getElementById('add-new-list-btn');

newListBtn.addEventListener('click', () => {
    fetch('/tasks/new-list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Redirect to the newly created list immediately
            window.location.href = `/tasks?list_name=${encodeURIComponent(data.list_name)}`;
        } else {
            alert('Error creating new list.');
        }
    });
});

// --- RENAME THE ENTIRE LIST ---
const listInput = document.getElementById('list-name-input');
const oldListName = "{{ selected_list }}";

listInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        const newName = this.value.trim();
        if (newName && newName !== oldListName) {
            fetch('/tasks/rename-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_name: oldListName, new_name: newName })
            }).then(() => {
                window.location.href = `/tasks?list_name=${encodeURIComponent(newName)}`;
            });
        }
    }
});

// --- RENAME INDIVIDUAL TASKS ---
document.querySelectorAll('.task-text-input').forEach(input => {
    input.addEventListener('blur', function() {
        const taskId = this.getAttribute('data-task-id');
        const newName = this.value.trim();
        
        if (newName) {
            fetch(`/tasks/rename-task/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_name: newName })
            });
        }
    });

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            this.blur(); // Trigger the save logic above
        }
    });
});

// --- DELETE TASK ---
document.querySelectorAll('.delete-task-btn').forEach(button => {
    button.addEventListener('click', function() {
        const taskId = this.getAttribute('data-task-id');
        const row = document.getElementById(`task-container-${taskId}`);

        if (confirm('Are you sure you want to delete this task?')) {
            fetch(`/tasks/delete/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    row.remove(); // Remove from UI immediately without refresh
                } else {
                    alert('Error deleting task.');
                }
            });
        }
    });
});

// --- DELETE ENTIRE LIST ---
const deleteListBtn = document.getElementById('delete-list-btn');

deleteListBtn.addEventListener('click', () => {
    const listToDelete = "{{ selected_list }}";
    
    if (confirm(`Are you sure you want to delete the entire "${listToDelete}" list? This cannot be undone.`)) {
        fetch('/tasks/delete-list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ list_name: listToDelete })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Redirect back to main tasks page to load a different list
                window.location.href = '/tasks';
            } else {
                alert('Error deleting list.');
            }
        });
    }
});
</script>
{% endblock %}
