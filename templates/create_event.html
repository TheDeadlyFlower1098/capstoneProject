{% extends "base.html" %}
{% block title %}Create Event · PlanIT{% endblock %}
{% block page_title %}Create Event{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_event.css') }}">
{% endblock %}

{% block content %}
<div class="content" style="padding: 24px; max-width: 720px; margin: 0 auto;">
  <div class="card">
    <form id="create-event-form" method="POST" action="{{ url_for('main.create_event_form') }}">
      
      <!-- Event Title -->
      <div class="form-group">
        <label for="title" class="form-label">Event Title</label>
        <input type="text" id="title" name="title" class="input" required>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="textarea"></textarea>
      </div>

      <!-- Location -->
      <div class="form-group">
        <label for="location" class="form-label">Location</label>
        <input type="text" id="location" name="location" class="input">
      </div>

      <!-- Dates -->
      <div class="time-row">
        <div class="form-group">
          <label for="date" class="form-label">Start Date</label>
          <input type="date" id="date" name="date" class="input" value="{{ selected_date or '' }}" required>
        </div>
        <div class="form-group">
          <label for="end_date" class="form-label">End Date (optional)</label>
          <input type="date" id="end_date" name="end_date" class="input">
        </div>
      </div>

      <!-- All-day toggle -->
      <div class="toggle-row">
        <input type="checkbox" id="all_day" name="all_day" class="input">
        <label for="all_day" class="form-label">All Day</label>
      </div>

      <!-- Start / End times -->
      <div class="time-row">
        <div class="form-group">
          <label for="start_time" class="form-label">Start Time</label>
          <input type="time" id="start_time" name="start_time" class="input">
        </div>
        <div class="form-group">
          <label for="end_time" class="form-label">End Time</label>
          <input type="time" id="end_time" name="end_time" class="input">
        </div>
      </div>

      <!-- Color -->
      <div class="form-group">
        <label class="form-label">Color</label>
        <div class="color-picker">
          <div class="color-badge selected" data-color="blue" style="background-color:#007bff;"></div>
          <div class="color-badge" data-color="red" style="background-color:#dc3545;"></div>
          <div class="color-badge" data-color="green" style="background-color:#28a745;"></div>
          <div class="color-badge" data-color="yellow" style="background-color:#ffc107;"></div>
        </div>
        <input type="hidden" id="selectedColor" name="color" value="blue">
      </div>

      <!-- Repeat -->
      <div class="form-group">
        <label for="repeat_type" class="form-label">Repeat</label>
        <select id="repeat_type" name="repeat_type" class="select">
          <option value="">None</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>

      <!-- Privacy -->
    <div class="form-group">
    <label for="is_private" class="form-label">Private Event</label>
    <select id="is_private" name="is_private" class="input">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>
    </div>

      <!-- Friend Invites -->
      <div class="form-group">
        <label class="form-label">Invite Friends</label>
        <div class="friends-list">
          {% for friend in friends %}
          <div class="toggle-row">
            <input type="checkbox" id="friend_{{ friend.id }}" name="invites" value="{{ friend.id }}" class="input">
            <label for="friend_{{ friend.id }}">
              <img src="{{ url_for('static', filename='profile_pics/' ~ friend.profile_pic) }}" alt="Profile" class="friend-pic" style="width:24px;height:24px;border-radius:999px;margin-right:6px;">
              {{ friend.first_name }} {{ friend.last_name }}
            </label>
          </div>
          {% endfor %}
        </div>
      </div>

      <!-- Submit -->
      <div class="submit-row" style="margin-top:16px;">
        <button type="submit" class="btn">Create Event</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/create_event.js') }}"></script>
{% endblock %}
