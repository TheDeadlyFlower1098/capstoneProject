{% extends "base.html" %}
{% block title %}Create Event · PlanIT{% endblock %}
{% block page_title %}Create Event{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/create_event.css') }}">
{% endblock %}

{% block content %}
<div class="content" style="padding: 24px; max-width: 720px; margin: 0 auto;">
  <div class="card">

    <form id="create-event-form">

      <!-- Event Title -->
      <div class="form-group">
        <label class="form-label">Event Title</label>
        <input type="text" id="title" name="title" class="input" required>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="description" name="description" class="textarea"></textarea>
      </div>

      <!-- Location -->
      <div class="form-group">
        <label class="form-label">Location</label>
        <input type="text" id="location" name="location" class="input">
      </div>

      <!-- Dates -->
      <div class="time-row">
        <div class="form-group">
          <label class="form-label">Start Date</label>
          <input type="date" id="date" name="date" class="input"
            value="{{ selected_date or now().strftime('%Y-%m-%d') }}" required>
        </div>

        <div class="form-group">
          <label class="form-label">End Date (optional)</label>
          <input type="date" id="end_date" name="end_date" class="input">
        </div>
      </div>

      <!-- All Day -->
      <div class="toggle-row">
        <input type="checkbox" id="all_day" name="all_day">
        <label for="all_day" class="form-label">All Day</label>
      </div>

      <!-- Time -->
      <div class="time-row" id="time-fields">
        <div class="form-group">
          <label class="form-label">Start Time</label>
          <select id="start_time" name="start_time" class="select"></select>
        </div>

        <div class="form-group">
          <label class="form-label">End Time</label>
          <select id="end_time" name="end_time" class="select"></select>
        </div>
      </div>

      <!-- Color -->
      <div class="form-group">
        <label class="form-label">Color</label>

        <div class="color-picker">
          <button type="button" class="color-badge selected" data-color="blue" style="background:#007bff;"></button>
          <button type="button" class="color-badge" data-color="red" style="background:#dc3545;"></button>
          <button type="button" class="color-badge" data-color="green" style="background:#28a745;"></button>
          <button type="button" class="color-badge" data-color="yellow" style="background:#ffc107;"></button>
          <button type="button" class="color-badge" data-color="purple" style="background:#6f42c1;"></button>
        </div>

        <input type="hidden" id="selectedColor" name="color" value="blue">
      </div>

      <!-- Repeat -->
      <div class="form-group">
        <label class="form-label">Repeat</label>
        <select id="repeat_type" name="repeat_type" class="select">
          <option value="">None</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <!-- Reminder -->
      <div class="form-group">
        <label class="form-label">Reminder</label>
        <select id="reminder" name="reminder" class="select">
          <option value="">Use default</option>
          <option value="5">5 minutes before</option>
          <option value="10">10 minutes before</option>
          <option value="15">15 minutes before</option>
          <option value="30">30 minutes before</option>
          <option value="60">1 hour before</option>
          <option value="120">2 hours before</option>
          <option value="1440">1 day before</option>
        </select>
      </div>

      <!-- Friend Invites -->
      <div class="form-group">
        <label class="form-label">Invite Friends</label>

        <div class="friends-list">
          {% for friend in friends %}
          <div class="toggle-row">
            <input type="checkbox" value="{{ friend.id }}" class="invite-checkbox" name="invites">
            <label>
              <img src="{{ url_for('static', filename='profile_pics/' ~ friend.profile_pic) }}"
                   style="width:24px;height:24px;border-radius:999px;margin-right:6px;">
              {{ friend.first_name }} {{ friend.last_name }}
            </label>
          </div>
          {% endfor %}
        </div>
      </div>

      <!-- Submit -->
      <div class="submit-row" style="margin-top:20px;">
        <button type="submit" class="btn">Create Event</button>
      </div>

    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {

  const form = document.getElementById("create-event-form");
  const allDayCheckbox = document.getElementById("all_day");
  const timeFields = document.getElementById("time-fields");
  const startTime = document.getElementById("start_time");
  const endTime = document.getElementById("end_time");

  // =========================
  // TIME FORMAT
  // =========================
  function getTimeFormat() {
    try {
      const settings = JSON.parse(localStorage.getItem("planit_settings"));
      return settings?.timeFormat || "12";
    } catch {
      return "12";
    }
  }

  const timeFormat = getTimeFormat();

  function populateTimeDropdown(selectEl, format) {
    selectEl.innerHTML = '<option value="">Select time</option>';

    for (let hour = 0; hour < 24; hour++) {
      for (let min of [0, 15, 30, 45]) {

        let value = `${String(hour).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
        let label;

        if (format === "12") {
          let displayHour = hour % 12 || 12;
          let ampm = hour < 12 ? "AM" : "PM";
          label = `${displayHour}:${String(min).padStart(2, "0")} ${ampm}`;
        } else {
          label = value;
        }

        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;

        selectEl.appendChild(option);
      }
    }
  }

  populateTimeDropdown(startTime, timeFormat);
  populateTimeDropdown(endTime, timeFormat);

  // =========================
  // DEFAULT TIME (rounded now)
  // =========================
  const now = new Date();
  const roundedMinutes = Math.ceil(now.getMinutes() / 15) * 15;
  now.setMinutes(roundedMinutes);

  const defaultTime = now.toTimeString().slice(0,5);
  startTime.value = defaultTime;

  // =========================
  // AUTO END TIME (+1 hour)
  // =========================
  startTime.addEventListener("change", () => {
    if (!startTime.value) return;

    let [h, m] = startTime.value.split(":").map(Number);
    h = (h + 1) % 24;

    endTime.value = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  });

  // =========================
  // ALL DAY TOGGLE
  // =========================
  allDayCheckbox.addEventListener("change", function() {
    timeFields.style.display = this.checked ? "none" : "flex";
  });

  // =========================
  // COLOR PICKER
  // =========================
  document.querySelectorAll(".color-badge").forEach(badge => {
    badge.addEventListener("click", function() {
      document.querySelectorAll(".color-badge").forEach(b => b.classList.remove("selected"));
      this.classList.add("selected");
      document.getElementById("selectedColor").value = this.dataset.color;
    });
  });

  // =========================
  // SUBMIT
  // =========================
  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const invites = Array.from(document.querySelectorAll(".invite-checkbox:checked"))
      .map(cb => cb.value);

    const data = {
      title: document.getElementById("title").value,
      description: document.getElementById("description").value,
      location: document.getElementById("location").value,
      date: document.getElementById("date").value,
      end_date: document.getElementById("end_date").value,
      all_day: allDayCheckbox.checked,
      start_time: startTime.value,
      end_time: endTime.value,
      color: document.getElementById("selectedColor").value,
      repeat_type: document.getElementById("repeat_type").value,
      reminder: document.getElementById("reminder").value,
      invites: invites
    };

    const settings = JSON.parse(localStorage.getItem("planit_settings") || "{}");

    if (!data.reminder && settings.defaultReminderMinutes && settings.defaultReminderMinutes !== "none") {
      data.reminder = settings.defaultReminderMinutes;
    }

    try {
      const response = await fetch("{{ url_for('events.create_event') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (result.success) {
        window.location.href = "{{ url_for('main.calendar') }}";
      } else {
        alert(result.error || "Error creating event.");
      }

    } catch (err) {
      console.error(err);
      alert("Server error.");
    }
  });

});
</script>
{% endblock %}
